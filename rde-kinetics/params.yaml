# ============================================================
# RDE 动力学参数测定 — Fe(CN)₆³⁻/⁴⁻ 体系
# 仪器: CHI660E | 技术: Tafel Plot | 电极: Pt 盘电极
# 实验1: 旋转圆盘电极动力学参数的测定
# ============================================================

# --- 电极参数 ---
electrode:
  material: "Pt 盘电极"
  diameter_cm: 0.5
  area_cm2: 0.19635
  area_for_j: 0.196

# --- 电解液参数 (1M KCl, 25°C) ---
electrolyte:
  supporting: "1 M KCl"
  redox_couple: "K₄Fe(CN)₆ / K₃Fe(CN)₆"
  viscosity_cm2_per_s: 0.0089       # ν, 动力学粘度 (1M KCl, 25°C)
  faraday_constant: 96485
  temperature_c: 25

# --- Tafel Plot 扫描参数 ---
tafel:
  init_e_v: -0.1
  final_e_v: 0.5
  scan_rate_v_per_s: 0.01
  quiet_time_s: 2
  sample_interval_v: 0.001

# --- 转速配置 (Part A: 同浓度不同转速) ---
rotation_speeds_rpm: [500, 1000, 1500, 1800, 2000, 2500]

# --- 浓度配置 (Part B: 同转速不同浓度) ---
concentrations:
  # c* for K₃Fe(CN)₆ and K₄Fe(CN)₆ (equimolar)
  values_mol_per_L: [0.0002, 0.0004, 0.0006, 0.0008, 0.01]
  target_rpm: 2000
  # 无KCl对照 (0.0008M only)
  no_kcl:
    enabled: true
    value_mol_per_L: 0.0008

# --- Levich 分析参数 ---
levich:
  n_electrons: 1                # Fe(CN)₆³⁻ + e⁻ ⇌ Fe(CN)₆⁴⁻
  # 扩散系数文献参考值 (1M KCl, 25°C)
  D_O_literature_cm2_per_s: 7.6e-6    # Fe(CN)₆³⁻
  D_R_literature_cm2_per_s: 6.3e-6    # Fe(CN)₆⁴⁻

# --- 极限电流提取区间 ---
limiting_current:
  cathode_range: [-0.10, -0.08]     # 阴极极限电流区 (V)
  anode_range: [0.48, 0.50]         # 阳极极限电流区 (V)

# --- K-L 分析配置 ---
kl_analysis:
  # 选6个超电势 η (偏离平衡电位)
  overpotentials_mv: [80, 100, 120, 150, 180, 200]
  # 选过电位对应的电位区间容差
  potential_tol_v: 0.005
  half_wave_search_range: [-0.05, 0.45]

# --- Tafel 分析 ---
tafel_analysis:
  # 线性区电位范围
  range_v: [-0.05, 0.05]           # 相对于平衡电位

# --- 催化剂分组 (4组独立操作者) ---
groups:
  "1组": "操作者 A1"
  "2组": "操作者 A2"
  "3组": "操作者 B1"
  "4组": "操作者 B2"

# --- 数据路径 ---
data:
  source_root: "data"
  groups: ["1组", "2组", "3组", "4组"]

# --- 输出配置 ---
output:
  root: "output"
  processed_dir: "output/processed"
  tables_dir: "output/tables"
  figures_dir: "output/figures"
