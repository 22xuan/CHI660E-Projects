name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test ORR
        run: pip install -r orr/requirements.txt && cd orr && python3 tests/test_parse.py && python3 tests/test_kl.py
      - name: Test RDE
        run: pip install -r rde-kinetics/requirements.txt && cd rde-kinetics && python3 tests/test_levich.py
